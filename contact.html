<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request a Case Review | Contact | RestoreRankGBP</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <meta name="description" content="Request a specialist diagnostic for your Google Business Profile. Short form: business name, city, issue type, urgency.">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="container nav">
      <div class="logo"><img src="logo.svg" alt="GBP Emblem" style="height:32px;width:32px;"> RestoreRankGBP</div>
      <nav><ul><li><a href="reinstatement.html">Reinstatement</a></li><li><a href="ranking.html">Ranking</a></li><li><a href="process.html">Process</a></li><li><a href="about.html">About</a></li><li><a href="contact.html">Contact</a></li></ul></nav>
      <a href="contact.html" class="cta-btn">Request Case Review</a>
    </div>
  </header>
  <section class="page-hero"><div class="container"><h1>Request a Case Review</h1><p>Short diagnostic form. No obligation.</p></div></section>
  <section>
    <div class="container" style="max-width:600px;">
      <form action="mailto:farber.inc@gmail.com" method="post" enctype="text/plain">
        <div class="form-group"><label>Business Name</label><input type="text" name="Business Name" required></div>
        <div class="form-group"><label>City / Service Area</label><input type="text" name="City" required></div>
        <div class="form-group"><label>Issue Type</label>
          <select name="Issue Type" required>
            <option value="">Select...</option>
            <option>Suspended / Restricted Profile</option>
            <option>Want to Rank Higher</option>
            <option>Ownership / Access Issue</option>
            <option>Verification Problem</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group"><label>Urgency</label>
          <select name="Urgency">
            <option>Standard</option>
            <option>High — losing revenue daily</option>
            <option>Critical</option>
          </select>
        </div>
        <div class="form-group"><label>Brief Description (optional)</label><textarea name="Description" rows="4"></textarea></div>
        <div class="form-group"><label>Your Email</label><input type="email" name="Email" required></div>
        <button type="submit">Request Case Review</button>
      </form>
      <p style="margin-top:1.5rem; font-size:0.95rem; color:var(--gray);">We typically respond within one business day. Or email directly: farber.inc@gmail.com</p>
    </div>
  </section>
  <footer><div class="container"><p>&copy; 2026 RestoreRankGBP · <a href="index.html">Home</a></p></div></footer>
</body>
</html>
